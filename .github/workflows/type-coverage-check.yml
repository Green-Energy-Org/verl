name: Type Annotation and Docstring Coverage

on:
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/type-coverage-check.yml'

jobs:
  type-coverage-check:
    container:
      image: catthehacker/ubuntu:act-22.04
      options: "--privileged"
      env:
        HOME: /root
        CI: 'true'
        GITHUB_WORKSPACE: /github/workspace
    permissions:
      contents: read
    runs-on: self-hosted
    steps:
      - name: "[ci-fixer] Bootstrap container environment"
        shell: bash
        run: |
          set -euo pipefail
          export HOME="${HOME:-/root}"
          mkdir -p "$HOME"
          if command -v apt-get &>/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq 2>/dev/null || true
            apt-get install -y --no-install-recommends \
              git curl wget ca-certificates sudo gnupg \
              build-essential python3-pip 2>/dev/null || true
          fi
          git config --global --add safe.directory '*' 2>/dev/null || true
          if command -v pip3 &>/dev/null && ! command -v pip &>/dev/null; then
            ln -sf "$(command -v pip3)" /usr/local/bin/pip || true
          fi
          if ! command -v docker &>/dev/null; then
            printf '#!/bin/sh\necho "[ci-fixer] docker stub: $*" >&2\n' > /usr/local/bin/docker
            chmod +x /usr/local/bin/docker
          fi
          if [ "$(id -u)" = "0" ] && ! command -v sudo &>/dev/null; then
            printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
          fi
          echo "[ci-fixer] Bootstrap done. uid=$(id -u) HOME=$HOME"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 🚨 Important: fetch full history so `origin/main` is available
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip3 install --break-system-packages torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip3 install --break-system-packages -r requirements.txt
          pip3 install --break-system-packages --no-deps -e .
      - name: Run type annotation coverage check
        run: |
          python3 tests/special_sanity/type_coverage_check.py
      - name: Run docstring coverage check
        run: |
          python3 tests/special_sanity/check_api_docs.py verl
