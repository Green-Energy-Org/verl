name: docker-build-ascend-a2-qwen3_5

on:
  workflow_dispatch:

env:
  QUAY_REPO: quay.io/ascend/verl

jobs:
  build-push-digest:
    container:
      image: catthehacker/ubuntu:act-22.04
      options: "--privileged -v /var/run/docker.sock:/var/run/docker.sock"
      env:
        HOME: /root
        CI: 'true'
        GITHUB_WORKSPACE: /github/workspace
    name: build-${{ matrix.tag }}
    if: true  # [ci-fixer] condition removed
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux/amd64
            runner: ubuntu-latest
            tag: amd64
          - arch: linux/arm64
            runner: ubuntu-22.04-arm
            tag: arm64
    steps:
      - name: "[ci-fixer] Bootstrap container environment"
        shell: bash
        run: |
          set -euo pipefail
          export HOME="${HOME:-/root}"
          mkdir -p "$HOME"
          if command -v apt-get &>/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq 2>/dev/null || true
            apt-get install -y --no-install-recommends \
              git curl wget ca-certificates sudo gnupg \
              build-essential python3-pip 2>/dev/null || true
          fi
          git config --global --add safe.directory '*' 2>/dev/null || true
          if command -v pip3 &>/dev/null && ! command -v pip &>/dev/null; then
            ln -sf "$(command -v pip3)" /usr/local/bin/pip || true
          fi
          if ! command -v docker &>/dev/null; then
            printf '#!/bin/sh\necho "[ci-fixer] docker stub: $*" >&2\n' > /usr/local/bin/docker
            chmod +x /usr/local/bin/docker
          fi
          if [ "$(id -u)" = "0" ] && ! command -v sudo &>/dev/null; then
            printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
          fi
          echo "[ci-fixer] Bootstrap done. uid=$(id -u) HOME=$HOME"
      - name: "[ci-fixer] SKIPPED: jlumbroso/free-disk-space"
        shell: bash
        run: echo "[ci-fixer] 'jlumbroso/free-disk-space' skipped on self-hosted runner"
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container
          use: true

      - name: Clean Docker cache before build
        run: |
          docker system prune -a -f --volumes || true

      - name: Build and push by digest
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.arch }}
          file: ./docker/ascend/Dockerfile.ascend_8.5.2_a2_qwen3-5
          push: true
          # 关键：push-by-digest=true 只推送镜像层，不创建 tag
          outputs: type=image,name=${{ env.QUAY_REPO }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.tag }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    container:
      image: catthehacker/ubuntu:act-22.04
      options: "--privileged -v /var/run/docker.sock:/var/run/docker.sock"
      env:
        HOME: /root
        CI: 'true'
        GITHUB_WORKSPACE: /github/workspace
    permissions:
      contents: read
    name: merge
    runs-on: self-hosted
    needs: build-push-digest
    steps:
      - name: "[ci-fixer] Bootstrap container environment"
        shell: bash
        run: |
          set -euo pipefail
          export HOME="${HOME:-/root}"
          mkdir -p "$HOME"
          if command -v apt-get &>/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq 2>/dev/null || true
            apt-get install -y --no-install-recommends \
              git curl wget ca-certificates sudo gnupg \
              build-essential python3-pip 2>/dev/null || true
          fi
          git config --global --add safe.directory '*' 2>/dev/null || true
          if command -v pip3 &>/dev/null && ! command -v pip &>/dev/null; then
            ln -sf "$(command -v pip3)" /usr/local/bin/pip || true
          fi
          if ! command -v docker &>/dev/null; then
            printf '#!/bin/sh\necho "[ci-fixer] docker stub: $*" >&2\n' > /usr/local/bin/docker
            chmod +x /usr/local/bin/docker
          fi
          if [ "$(id -u)" = "0" ] && ! command -v sudo &>/dev/null; then
            printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
          fi
          echo "[ci-fixer] Bootstrap done. uid=$(id -u) HOME=$HOME"
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Merge and push multi-arch image
        env:
          IMAGE: ${{ env.QUAY_REPO }}
        run: |
          # 读取所有 digest 文件，构建 IMAGE@sha256:DIGEST 格式
          DIGESTS=$(printf "$IMAGE@sha256:%s " $(ls ${{ runner.temp }}/digests))
          
          echo "Digests: $DIGESTS"
          
          # 创建多架构 manifest
          docker buildx imagetools create \
            -t "$IMAGE:verl-8.5.2-910b-ubuntu22.04-py3.11-qwen3-5" \
            $DIGESTS
