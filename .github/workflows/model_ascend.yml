          fi

          # Ensure git is usable (safe directory for mounted workspaces)
          git config --global --add safe.directory '*' 2>/dev/null || true

          # pip / pip3 aliases
          if command -v pip3 &>/dev/null && ! command -v pip &>/dev/null; then
            ln -sf "$(command -v pip3)" /usr/local/bin/pip || true
          fi

          # Docker CLI stub (no-op) if docker daemon not available
          if ! command -v docker &>/dev/null; then
            printf '#!/bin/sh\necho "[ci-fixer] docker stub: docker $*" >&2\n' > /usr/local/bin/docker
            chmod +x /usr/local/bin/docker
