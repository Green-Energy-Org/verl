name: scheduled pre-commit autofix

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  precommit:
    container:
      image: catthehacker/ubuntu:act-22.04
      options: "--privileged"
      env:
        HOME: /root
        CI: 'true'
        GITHUB_WORKSPACE: /github/workspace
    permissions:
      contents: read
    if: true  # [ci-fixer] condition removed
    runs-on: self-hosted

    steps:
      - name: "[ci-fixer] Bootstrap container environment"
        shell: bash
        run: |
          set -euo pipefail
          export HOME="${HOME:-/root}"
          mkdir -p "$HOME"
          if command -v apt-get &>/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq 2>/dev/null || true
            apt-get install -y --no-install-recommends \
              git curl wget ca-certificates sudo gnupg \
              build-essential python3-pip 2>/dev/null || true
          fi
          git config --global --add safe.directory '*' 2>/dev/null || true
          if command -v pip3 &>/dev/null && ! command -v pip &>/dev/null; then
            ln -sf "$(command -v pip3)" /usr/local/bin/pip || true
          fi
          if ! command -v docker &>/dev/null; then
            printf '#!/bin/sh\necho "[ci-fixer] docker stub: $*" >&2\n' > /usr/local/bin/docker
            chmod +x /usr/local/bin/docker
          fi
          if [ "$(id -u)" = "0" ] && ! command -v sudo &>/dev/null; then
            printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
          fi
          echo "[ci-fixer] Bootstrap done. uid=$(id -u) HOME=$HOME"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit
        run: |
          python -m pip install --break-system-packages --upgrade pip
          pip install --break-system-packages pre-commit hydra-core

      - name: Run pre-commit
        run: |
          pre-commit run --all-files || true

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/precommit-autofix
          delete-branch: true
          title: "[ci] chore: scheduled pre-commit autofix"
          commit-message: "chore: auto-fix pre-commit issues"
          body: |
            This PR was created automatically by a scheduled GitHub Action.

            - Runs `pre-commit run --all-files`
            - Triggered hourly
          labels: |
            automated
            pre-commit
