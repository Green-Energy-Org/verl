# c.f. https://github.com/pre-commit/action?tab=readme-ov-file#using-this-action
name: pre-commit

# No need to avoid / cancel lightweight pre-commit jobs
on:
  schedule:
    - cron: "0 0 * * 0"
  pull_request:
  push:
    branches:
      - main
      - v0.*
  # Allow manual triggering
  workflow_dispatch:

# Declare permissions just read content.
permissions:
  contents: read

jobs:
  pre-commit:
    container:
      image: catthehacker/ubuntu:act-22.04
      options: "--privileged"
      env:
        HOME: /root
        CI: 'true'
        GITHUB_WORKSPACE: /github/workspace
    permissions:
      contents: read
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: "[ci-fixer] Bootstrap container environment"
        shell: bash
        run: |
          set -euo pipefail
          export HOME="${HOME:-/root}"
          mkdir -p "$HOME"
          if command -v apt-get &>/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq 2>/dev/null || true
            apt-get install -y --no-install-recommends \
              git curl wget ca-certificates sudo gnupg \
              build-essential python3-pip 2>/dev/null || true
          fi
          git config --global --add safe.directory '*' 2>/dev/null || true
          if command -v pip3 &>/dev/null && ! command -v pip &>/dev/null; then
            ln -sf "$(command -v pip3)" /usr/local/bin/pip || true
          fi
          if ! command -v docker &>/dev/null; then
            printf '#!/bin/sh\necho "[ci-fixer] docker stub: $*" >&2\n' > /usr/local/bin/docker
            chmod +x /usr/local/bin/docker
          fi
          if [ "$(id -u)" = "0" ] && ! command -v sudo &>/dev/null; then
            printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
          fi
          echo "[ci-fixer] Bootstrap done. uid=$(id -u) HOME=$HOME"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the current repository
        run: |
          pip install --break-system-packages pre-commit hydra-core
          pip install --break-system-packages --no-deps -e .
      - name: Set ruff --output-format=github
        run: |
          sed -i 's/--output-format=full/--output-format=github/' .pre-commit-config.yaml
          git add .pre-commit-config.yaml
      # Check "--all-files" by default
      - uses: pre-commit/action@v3.0.1
